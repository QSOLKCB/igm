[package]
name = "igm-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic non-clinical structural research runtime for QSOLKCB/igm"
repository = "https://github.com/QSOLKCB/igm"

[lib]
path = "runtime/rust/src/lib.rs"

[[bin]]
name = "igm-runtime"
path = "runtime/rust/src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
