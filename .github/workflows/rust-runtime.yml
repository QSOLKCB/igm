name: IGM Rust runtime checks

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/**"
      - "profiles/**"
      - "schemas/**"
      - "tools/validate_docs.py"
      - "tools/validate_profile.py"
      - "tools/validate_json_schema.py"
      - "tools/validate_campaign.py"
      - "tools/validate_campaign_v2.py"
      - "tests/property_fuzz.rs"
      - "tests/site-model.mjs"
      - "site/igm-model.mjs"
      - "docs/RUST_RUNTIME.md"
      - "docs/RUNTIME_LINEAGE.md"
      - "docs/PENTA_CRT_CPU.md"
      - "docs/EXECUTION_CAMPAIGNS.md"
      - "docs/PROPERTY_FUZZING.md"
      - "docs/TIMING_BENCHMARK.md"
      - "docs/PRE_PHASE5_READINESS.md"
      - "ROADMAP.md"
      - ".github/workflows/rust-runtime.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/**"
      - "profiles/**"
      - "schemas/**"
      - "tools/validate_docs.py"
      - "tools/validate_profile.py"
      - "tools/validate_json_schema.py"
      - "tools/validate_campaign.py"
      - "tools/validate_campaign_v2.py"
      - "tests/property_fuzz.rs"
      - "tests/site-model.mjs"
      - "site/igm-model.mjs"
      - "docs/RUST_RUNTIME.md"
      - "docs/RUNTIME_LINEAGE.md"
      - "docs/PENTA_CRT_CPU.md"
      - "docs/EXECUTION_CAMPAIGNS.md"
      - "docs/PROPERTY_FUZZING.md"
      - "docs/TIMING_BENCHMARK.md"
      - "docs/PRE_PHASE5_READINESS.md"
      - "ROADMAP.md"
      - ".github/workflows/rust-runtime.yml"

permissions:
  contents: read

jobs:
  rust-reference:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
      - name: Mandatory documentation and profile gates
        run: |
          python3 tools/validate_docs.py
          python3 tools/validate_json_schema.py --self-test
          python3 tools/validate_profile.py --self-test
          python3 tools/validate_json_schema.py profiles/igm-schematic-pentamer-v0.json
          python3 tools/validate_profile.py profiles/igm-schematic-pentamer-v0.json
          python3 -m json.tool runtime/profiles/igm-penta-crt-cpu-v1.json >/dev/null
          python3 -m json.tool schemas/campaign-manifest.schema.json >/dev/null
          python3 -m json.tool schemas/correctness-receipt.schema.json >/dev/null
          python3 -m json.tool schemas/phase3c-gate-receipt.schema.json >/dev/null
          python3 -m py_compile tools/validate_campaign.py tools/validate_campaign_v2.py
      - name: Preserve browser reference
        run: node tests/site-model.mjs
      - name: Rust tests
        run: cargo test --locked --all-targets
      - name: Phase 3A property fuzzing
        env:
          IGM_PROPERTY_FUZZ_SEED: "0x49474d50524f5037"
          IGM_PROPERTY_FUZZ_CASES: "2048"
        run: cargo test --locked --test property_fuzz -- --nocapture
      - name: Release build
        run: cargo build --locked --release
      - name: Runtime profile admission
        run: ./target/release/igm-runtime validate > /tmp/igm-validate.json
      - name: Exact CRT address probe
        run: ./target/release/igm-runtime address 17 > /tmp/igm-address.json
      - name: Worker-independent result identity
        run: |
          ./target/release/igm-runtime run --work-items 257 --workers 1 > /tmp/igm-run-1.json
          ./target/release/igm-runtime run --work-items 257 --workers 7 > /tmp/igm-run-7.json
          python3 - <<'PY'
          import json
          one = json.load(open('/tmp/igm-run-1.json', encoding='utf-8'))['summary']
          seven = json.load(open('/tmp/igm-run-7.json', encoding='utf-8'))['summary']
          assert one['result_sha256'] == seven['result_sha256']
          assert one['diagnostic_xor_fnv1a64'] == seven['diagnostic_xor_fnv1a64']
          assert one['manifest_sha256'] != seven['manifest_sha256']
          assert one['requested_workers'] == 1 and seven['requested_workers'] == 7
          assert one['workers'] == 1 and seven['workers'] == 7
          assert one['numerical_profile'] == 'IGM-RUST-F64-DETERMINISTIC-POLY-V1'
          assert one['hot_loop_trig_calls'] == 0 == seven['hot_loop_trig_calls']
          assert one['hot_loop_sqrt_calls'] == 0 == seven['hot_loop_sqrt_calls']
          assert one['biological_validity_claimed'] is False
          assert one['clinical_validity_claimed'] is False
          print('OK: worker-independent IGM Rust result identity')
          PY
      - name: Manifest records requested versus effective workers
        run: |
          ./target/release/igm-runtime run --work-items 1 --workers 7 > /tmp/igm-run-small.json
          python3 - <<'PY'
          import json
          summary = json.load(open('/tmp/igm-run-small.json', encoding='utf-8'))['summary']
          assert summary['requested_workers'] == 7
          assert summary['workers'] == 1
          assert len(summary['worker_summaries']) == 1
          print('OK: manifest plan is reconstructible from report')
          PY
      - name: PENTA-CRT profile and address round-trip
        run: |
          ./target/release/igm-penta-crt profile > /tmp/igm-penta-profile.json
          ./target/release/igm-penta-crt address 17000 > /tmp/igm-penta-address.json
          python3 - <<'PY'
          import json
          profile = json.load(open('/tmp/igm-penta-profile.json', encoding='utf-8'))
          address = json.load(open('/tmp/igm-penta-address.json', encoding='utf-8'))
          assert profile['radices'] == [17, 17, 9, 9]
          assert profile['total_conformations'] == 23409
          assert profile['numerical_profile'] == 'IGM-PENTA-CRT-F64-LUT-BLOCK-CIRCULANT-ZRESIDUAL-V1'
          assert address['index'] == address['round_trip_index'] == 17000
          assert profile['biological_validity_claimed'] is False
          print('OK: PENTA-CRT execution profile and mixed-radix address')
          PY
      - name: PENTA-CRT structured reuse residual gate
        run: |
          ./target/release/igm-penta-crt verify --samples 257 > /tmp/igm-penta-verify.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/igm-penta-verify.json', encoding='utf-8'))
          assert report['accepted'] is True
          assert report['planar_block_evaluations_per_conformation'] == 45
          assert report['sparse_j_evaluations_per_conformation'] == 15
          assert report['structured_distance_evaluations_per_conformation'] == 60
          assert report['brute_distance_evaluations_per_conformation'] == 120
          assert report['exact_z_residual_corrections_per_conformation'] == 105
          assert report['residual_tolerance'] == 1e-12
          assert report['max_block_reuse_vs_brute_pair_residual'] <= report['residual_tolerance']
          assert report['biological_validity_claimed'] is False
          print('OK: PENTA-CRT structured reuse remains inside fixed residual gate')
          PY
      - name: Phase 3B scalar/reference vs optimized timing benchmark
        run: |
          ./target/release/igm-benchmark --count 257 --repetitions 3 --warmups 1 --verify-samples 257 > /tmp/igm-timing-benchmark.json
          python3 - <<'PY'
          import json, math
          report = json.load(open('/tmp/igm-timing-benchmark.json', encoding='utf-8'))
          assert report['schema'] == 'IGM-PENTA-CRT-TIMING-BENCHMARK-V1'
          assert report['benchmark_contract'] == 'IGM-PHASE3B-SCALAR-VS-OPTIMIZED-BENCHMARK-V1'
          assert report['reference_profile'] == 'IGM-PENTA-CRT-F64-REFERENCE-BRUTE-V1'
          assert report['optimized_contract'] == 'IGM-PENTA-CRT-CPU-V1'
          assert report['validation_level'] == 'V0'
          assert report['release_build'] is True
          assert report['single_threaded_comparison'] is True
          assert report['phase3b_residual_gate_passed'] is True
          assert report['verification_tolerance'] == 1e-12
          assert len(report['reference_times_ns']) == len(report['optimized_times_ns']) == 3
          assert report['reference_median_ns'] > 0 and report['optimized_median_ns'] > 0
          assert math.isfinite(report['observed_speedup_ratio']) and report['observed_speedup_ratio'] > 0
          assert report['benchmark_timing_identity_bearing'] is False
          assert report['correctness_identity_includes_timing'] is False
          assert report['speedup_claimed'] is False
          assert report['performance_claim'] is False
          assert report['non_clinical'] is True
          assert report['biological_validity_claimed'] is False
          assert report['clinical_validity_claimed'] is False
          print('OK: timing benchmark contract is bounded and observation-only; no speedup threshold asserted')
          PY
      - name: PENTA-CRT optimized worker-independent identity
        run: |
          ./target/release/igm-penta-crt run --start 100 --count 257 --workers 1 > /tmp/igm-penta-1.json
          ./target/release/igm-penta-crt run --start 100 --count 257 --workers 7 > /tmp/igm-penta-7.json
          python3 - <<'PY'
          import json
          one = json.load(open('/tmp/igm-penta-1.json', encoding='utf-8'))['summary']
          seven = json.load(open('/tmp/igm-penta-7.json', encoding='utf-8'))['summary']
          assert one['result_sha256'] == seven['result_sha256']
          assert one['diagnostic_xor_fnv1a64'] == seven['diagnostic_xor_fnv1a64']
          assert one['manifest_sha256'] != seven['manifest_sha256']
          assert one['structured_distance_evaluations'] * 2 == one['logical_pair_checks']
          assert one['planar_block_evaluations'] + one['sparse_j_evaluations'] == one['structured_distance_evaluations']
          assert one['hot_loop_trig_calls'] == 0 == seven['hot_loop_trig_calls']
          assert one['hot_loop_sqrt_calls'] == 0 == seven['hot_loop_sqrt_calls']
          assert one['per_conformation_heap_allocations'] == 0
          assert one['performance_claim'] is False
          assert one['biological_validity_claimed'] is False
          print('OK: PENTA-CRT optimized result identity is worker independent')
          PY
      - name: Phase 3C execution graph and padded layout
        run: |
          ./target/release/igm-campaign graph > /tmp/igm-exec-graph.json
          ./target/release/igm-campaign layout > /tmp/igm-layout.json
          ./target/release/igm-campaign plan --start 100 --count 31 --budget-bytes 1024 > /tmp/igm-plan.json
          python3 - <<'PY'
          import json
          graph = json.load(open('/tmp/igm-exec-graph.json', encoding='utf-8'))
          layout = json.load(open('/tmp/igm-layout.json', encoding='utf-8'))
          plan = json.load(open('/tmp/igm-plan.json', encoding='utf-8'))
          assert graph['node_count'] == 30 and graph['degree'] == 5 and graph['edge_count_undirected'] == 75
          assert graph['biological_adjacency_claimed'] is False
          assert layout['warp_width'] == 32 and layout['meaningful_lanes'] == 30 and layout['padding_lanes'] == 2
          assert layout['scientific_count_includes_padding'] is False
          assert layout['cell_alignment_bytes'] == 128
          assert plan['memory']['chunk_count'] > 1
          assert plan['biological_validity_claimed'] is False
          print('OK: Phase 3C graph/layout/memory planning contract')
          PY
      - name: Phase 3C executable acceptance gate
        run: |
          rm -rf /tmp/igm-campaign-small /tmp/igm-campaign-wide
          ./target/release/igm-campaign run --start 100 --count 31 --workers 1 --budget-bytes 1024 --verify-samples 17 --out /tmp/igm-campaign-small > /tmp/igm-campaign-small.json
          ./target/release/igm-campaign run --start 100 --count 31 --workers 7 --budget-bytes 65536 --verify-samples 17 --out /tmp/igm-campaign-wide > /tmp/igm-campaign-wide.json
          python3 tools/validate_campaign.py /tmp/igm-campaign-small
          python3 tools/validate_campaign.py /tmp/igm-campaign-wide
          python3 - <<'PY'
          import json
          from pathlib import Path
          small = Path('/tmp/igm-campaign-small')
          wide = Path('/tmp/igm-campaign-wide')
          one = json.load(open(small/'correctness-receipt.json', encoding='utf-8'))
          seven = json.load(open(wide/'correctness-receipt.json', encoding='utf-8'))
          g1 = json.load(open(small/'phase3c-gate.json', encoding='utf-8'))
          g7 = json.load(open(wide/'phase3c-gate.json', encoding='utf-8'))
          m1 = json.load(open(small/'campaign-manifest.json', encoding='utf-8'))
          m7 = json.load(open(wide/'campaign-manifest.json', encoding='utf-8'))
          b1 = json.load(open(small/'benchmark-receipt.json', encoding='utf-8'))
          b7 = json.load(open(wide/'benchmark-receipt.json', encoding='utf-8'))
          assert one['result_sha256'] == seven['result_sha256']
          assert one['diagnostic_xor_fnv1a64'] == seven['diagnostic_xor_fnv1a64']
          assert g1['gate_identity_sha256'] == g7['gate_identity_sha256']
          for gate in (g1, g7):
              assert gate['accepted'] is True
              assert gate['profile_identity_preserved'] is True
              assert gate['algorithm_identity_preserved'] is True
              assert gate['phase3b_residual_gate_passed'] is True
              assert gate['finite_and_bounded'] is True
              assert gate['declared_slice_preserved'] is True
              assert gate['correctness_identity_recomputed'] is True
              assert gate['worker_independent_correctness_identity'] is True
              assert gate['chunk_independent_correctness_identity'] is True
              assert gate['benchmark_timing_excluded_from_correctness_identity'] is True
              assert gate['implementation_structures_biological_relationships_claimed'] is False
              assert gate['validation_level_promoted_by_runtime'] is False
              assert gate['validation_level'] == 'V0'
          assert b1['elapsed_seconds'] != b7['elapsed_seconds'] or b1['requested_workers'] != b7['requested_workers']
          assert b1['identity_bearing_correctness'] is False == b7['identity_bearing_correctness']
          assert m1['schema'] == m7['schema'] == 'IGM-CAMPAIGN-MANIFEST-V2'
          assert m1['manifest_sha256'] != m7['manifest_sha256']
          assert m1['gate_identity_sha256'] == m7['gate_identity_sha256']
          print('OK: explicit Phase 3C gate preserves correctness across worker/chunk/timing changes')
          PY
      - name: Phase 3C semantic tamper rejection
        run: |
          rm -rf /tmp/igm-campaign-tampered
          cp -a /tmp/igm-campaign-small /tmp/igm-campaign-tampered
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/igm-campaign-tampered/phase3c-gate.json')
          gate = json.loads(p.read_text())
          gate['benchmark_timing_excluded_from_correctness_identity'] = False
          p.write_text(json.dumps(gate, indent=2) + '\n')
          PY
          if python3 tools/validate_campaign.py /tmp/igm-campaign-tampered; then
            echo 'expected semantic Phase 3C gate tamper rejection' >&2
            exit 1
          fi
      - name: Phase 3C rejected campaign is preserved
        run: |
          rm -rf /tmp/igm-campaign-rejected /tmp/igm-campaign-range-rejected
          if ./target/release/igm-campaign run --start 100 --count 31 --workers 2 --budget-bytes 1 --verify-samples 17 --out /tmp/igm-campaign-rejected; then
            echo 'expected bounded memory rejection' >&2
            exit 1
          fi
          python3 tools/validate_campaign.py /tmp/igm-campaign-rejected
          if ./target/release/igm-campaign run --start 999999 --workers 2 --budget-bytes 1024 --verify-samples 17 --out /tmp/igm-campaign-range-rejected; then
            echo 'expected range rejection' >&2
            exit 1
          fi
          python3 tools/validate_campaign.py /tmp/igm-campaign-range-rejected
          python3 - <<'PY'
          import json
          memory = json.load(open('/tmp/igm-campaign-rejected/rejected.json', encoding='utf-8'))
          ranged = json.load(open('/tmp/igm-campaign-range-rejected/rejected.json', encoding='utf-8'))
          assert memory['preserved'] is True and memory['biological_validity_claimed'] is False
          assert memory['stage'] == 'phase3c-gate'
          assert ranged['stage'] == 'range-admission'
          print('OK: Phase 3C rejected-run preservation covers gate and range admission')
          PY
