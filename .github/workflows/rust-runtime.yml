name: IGM Rust runtime checks

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/**"
      - "profiles/**"
      - "schemas/**"
      - "tools/validate_docs.py"
      - "tools/validate_profile.py"
      - "tools/validate_json_schema.py"
      - "tools/validate_campaign.py"
      - "tests/site-model.mjs"
      - "site/igm-model.mjs"
      - "docs/RUST_RUNTIME.md"
      - "docs/RUNTIME_LINEAGE.md"
      - "docs/PENTA_CRT_CPU.md"
      - "docs/EXECUTION_CAMPAIGNS.md"
      - "ROADMAP.md"
      - ".github/workflows/rust-runtime.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/**"
      - "profiles/**"
      - "schemas/**"
      - "tools/validate_docs.py"
      - "tools/validate_profile.py"
      - "tools/validate_json_schema.py"
      - "tools/validate_campaign.py"
      - "tests/site-model.mjs"
      - "site/igm-model.mjs"
      - "docs/RUST_RUNTIME.md"
      - "docs/RUNTIME_LINEAGE.md"
      - "docs/PENTA_CRT_CPU.md"
      - "docs/EXECUTION_CAMPAIGNS.md"
      - "ROADMAP.md"
      - ".github/workflows/rust-runtime.yml"

permissions:
  contents: read

jobs:
  rust-reference:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
      - name: Mandatory documentation and profile gates
        run: |
          python3 tools/validate_docs.py
          python3 tools/validate_json_schema.py --self-test
          python3 tools/validate_profile.py --self-test
          python3 tools/validate_json_schema.py profiles/igm-schematic-pentamer-v0.json
          python3 tools/validate_profile.py profiles/igm-schematic-pentamer-v0.json
          python3 -m json.tool runtime/profiles/igm-penta-crt-cpu-v1.json >/dev/null
          python3 -m json.tool schemas/campaign-manifest.schema.json >/dev/null
          python3 -m json.tool schemas/correctness-receipt.schema.json >/dev/null
      - name: Preserve browser reference
        run: node tests/site-model.mjs
      - name: Rust tests
        run: cargo test --locked --all-targets
      - name: Release build
        run: cargo build --locked --release
      - name: Runtime profile admission
        run: ./target/release/igm-runtime validate > /tmp/igm-validate.json
      - name: Exact CRT address probe
        run: ./target/release/igm-runtime address 17 > /tmp/igm-address.json
      - name: Worker-independent result identity
        run: |
          ./target/release/igm-runtime run --work-items 257 --workers 1 > /tmp/igm-run-1.json
          ./target/release/igm-runtime run --work-items 257 --workers 7 > /tmp/igm-run-7.json
          python3 - <<'PY'
          import json
          with open('/tmp/igm-run-1.json', encoding='utf-8') as f:
              one = json.load(f)['summary']
          with open('/tmp/igm-run-7.json', encoding='utf-8') as f:
              seven = json.load(f)['summary']
          assert one['result_sha256'] == seven['result_sha256']
          assert one['diagnostic_xor_fnv1a64'] == seven['diagnostic_xor_fnv1a64']
          assert one['manifest_sha256'] != seven['manifest_sha256']
          assert one['requested_workers'] == 1
          assert seven['requested_workers'] == 7
          assert one['workers'] == 1
          assert seven['workers'] == 7
          assert one['numerical_profile'] == 'IGM-RUST-F64-DETERMINISTIC-POLY-V1'
          assert one['hot_loop_trig_calls'] == 0 == seven['hot_loop_trig_calls']
          assert one['hot_loop_sqrt_calls'] == 0 == seven['hot_loop_sqrt_calls']
          assert one['biological_validity_claimed'] is False
          assert one['clinical_validity_claimed'] is False
          print('OK: worker-independent IGM Rust result identity')
          PY
      - name: Manifest records requested versus effective workers
        run: |
          ./target/release/igm-runtime run --work-items 1 --workers 7 > /tmp/igm-run-small.json
          python3 - <<'PY'
          import json
          with open('/tmp/igm-run-small.json', encoding='utf-8') as f:
              summary = json.load(f)['summary']
          assert summary['requested_workers'] == 7
          assert summary['workers'] == 1
          assert len(summary['worker_summaries']) == 1
          print('OK: manifest plan is reconstructible from report')
          PY
      - name: PENTA-CRT profile and address round-trip
        run: |
          ./target/release/igm-penta-crt profile > /tmp/igm-penta-profile.json
          ./target/release/igm-penta-crt address 17000 > /tmp/igm-penta-address.json
          python3 - <<'PY'
          import json
          with open('/tmp/igm-penta-profile.json', encoding='utf-8') as f:
              profile = json.load(f)
          with open('/tmp/igm-penta-address.json', encoding='utf-8') as f:
              address = json.load(f)
          assert profile['radices'] == [17, 17, 9, 9]
          assert profile['total_conformations'] == 23409
          assert profile['numerical_profile'] == 'IGM-PENTA-CRT-F64-LUT-BLOCK-CIRCULANT-ZRESIDUAL-V1'
          assert address['index'] == address['round_trip_index'] == 17000
          assert profile['biological_validity_claimed'] is False
          print('OK: PENTA-CRT execution profile and mixed-radix address')
          PY
      - name: PENTA-CRT structured reuse residual gate
        run: |
          ./target/release/igm-penta-crt verify --samples 257 > /tmp/igm-penta-verify.json
          python3 - <<'PY'
          import json
          with open('/tmp/igm-penta-verify.json', encoding='utf-8') as f:
              report = json.load(f)
          assert report['accepted'] is True
          assert report['planar_block_evaluations_per_conformation'] == 45
          assert report['sparse_j_evaluations_per_conformation'] == 15
          assert report['structured_distance_evaluations_per_conformation'] == 60
          assert report['brute_distance_evaluations_per_conformation'] == 120
          assert report['exact_z_residual_corrections_per_conformation'] == 105
          assert report['max_block_reuse_vs_brute_pair_residual'] <= report['residual_tolerance']
          assert report['biological_validity_claimed'] is False
          print('OK: PENTA-CRT XY structured reuse + exact Z residuals remain within reference tolerance')
          PY
      - name: PENTA-CRT optimized worker-independent identity
        run: |
          ./target/release/igm-penta-crt run --start 100 --count 257 --workers 1 > /tmp/igm-penta-1.json
          ./target/release/igm-penta-crt run --start 100 --count 257 --workers 7 > /tmp/igm-penta-7.json
          python3 - <<'PY'
          import json
          with open('/tmp/igm-penta-1.json', encoding='utf-8') as f:
              one = json.load(f)['summary']
          with open('/tmp/igm-penta-7.json', encoding='utf-8') as f:
              seven = json.load(f)['summary']
          assert one['result_sha256'] == seven['result_sha256']
          assert one['diagnostic_xor_fnv1a64'] == seven['diagnostic_xor_fnv1a64']
          assert one['manifest_sha256'] != seven['manifest_sha256']
          assert one['structured_distance_evaluations'] * 2 == one['logical_pair_checks']
          assert one['planar_block_evaluations'] + one['sparse_j_evaluations'] == one['structured_distance_evaluations']
          assert one['hot_loop_trig_calls'] == 0 == seven['hot_loop_trig_calls']
          assert one['hot_loop_sqrt_calls'] == 0 == seven['hot_loop_sqrt_calls']
          assert one['per_conformation_heap_allocations'] == 0
          assert one['performance_claim'] is False
          assert one['biological_validity_claimed'] is False
          print('OK: PENTA-CRT optimized result identity is worker independent')
          PY
      - name: Phase 3C execution graph and padded layout
        run: |
          ./target/release/igm-campaign graph > /tmp/igm-exec-graph.json
          ./target/release/igm-campaign layout > /tmp/igm-layout.json
          ./target/release/igm-campaign plan --start 100 --count 31 --budget-bytes 1024 > /tmp/igm-plan.json
          python3 - <<'PY'
          import json
          graph = json.load(open('/tmp/igm-exec-graph.json', encoding='utf-8'))
          layout = json.load(open('/tmp/igm-layout.json', encoding='utf-8'))
          plan = json.load(open('/tmp/igm-plan.json', encoding='utf-8'))
          assert graph['node_count'] == 30
          assert graph['degree'] == 5
          assert graph['edge_count_undirected'] == 75
          assert graph['biological_adjacency_claimed'] is False
          assert layout['warp_width'] == 32
          assert layout['meaningful_lanes'] == 30
          assert layout['padding_lanes'] == 2
          assert layout['scientific_count_includes_padding'] is False
          assert layout['cell_alignment_bytes'] == 128
          assert plan['memory']['chunk_count'] > 1
          assert plan['biological_validity_claimed'] is False
          print('OK: Phase 3C graph/layout/memory planning contract')
          PY
      - name: Phase 3C accepted campaign and artifact validation
        run: |
          rm -rf /tmp/igm-campaign-small /tmp/igm-campaign-wide
          ./target/release/igm-campaign run --start 100 --count 31 --workers 1 --budget-bytes 1024 --verify-samples 17 --out /tmp/igm-campaign-small > /tmp/igm-campaign-small.json
          ./target/release/igm-campaign run --start 100 --count 31 --workers 7 --budget-bytes 65536 --verify-samples 17 --out /tmp/igm-campaign-wide > /tmp/igm-campaign-wide.json
          python3 tools/validate_campaign.py /tmp/igm-campaign-small
          python3 tools/validate_campaign.py /tmp/igm-campaign-wide
          python3 - <<'PY'
          import json
          one = json.load(open('/tmp/igm-campaign-small/correctness-receipt.json', encoding='utf-8'))
          seven = json.load(open('/tmp/igm-campaign-wide/correctness-receipt.json', encoding='utf-8'))
          m1 = json.load(open('/tmp/igm-campaign-small/memory-plan.json', encoding='utf-8'))
          m7 = json.load(open('/tmp/igm-campaign-wide/memory-plan.json', encoding='utf-8'))
          assert one['result_sha256'] == seven['result_sha256']
          assert one['diagnostic_xor_fnv1a64'] == seven['diagnostic_xor_fnv1a64']
          assert one['result_identity_worker_independent'] is True
          assert one['result_identity_chunk_independent'] is True
          assert m1['chunk_count'] != m7['chunk_count']
          assert one['biological_validity_claimed'] is False
          print('OK: Phase 3C correctness identity survives worker/chunk changes')
          PY
      - name: Phase 3C rejected campaign is preserved
        run: |
          rm -rf /tmp/igm-campaign-rejected
          if ./target/release/igm-campaign run --start 100 --count 31 --workers 2 --budget-bytes 1 --verify-samples 17 --out /tmp/igm-campaign-rejected; then
            echo 'expected bounded memory rejection' >&2
            exit 1
          fi
          python3 tools/validate_campaign.py /tmp/igm-campaign-rejected
          python3 - <<'PY'
          import json
          rejected = json.load(open('/tmp/igm-campaign-rejected/rejected.json', encoding='utf-8'))
          assert rejected['preserved'] is True
          assert rejected['biological_validity_claimed'] is False
          assert rejected['stage'] == 'campaign-execution'
          print('OK: Phase 3C rejected-run preservation')
          PY
