name: IGM Phase 4 evidence adapter checks

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/rust/src/lib_v5.rs"
      - "runtime/rust/src/phase4.rs"
      - "runtime/rust/src/phase4_v2.rs"
      - "runtime/rust/src/evidence_main.rs"
      - "research/sources.json"
      - "research/source-snapshot-policy.json"
      - "research/v0-implementation-constants.json"
      - "research/evidence/**"
      - "schemas/source-registry.schema.json"
      - "schemas/evidence-input.schema.json"
      - "schemas/evidence-bundle.schema.json"
      - "schemas/source-snapshot-policy.schema.json"
      - "schemas/model-profile.schema.json"
      - "tools/validate_sources.py"
      - "tools/validate_phase4.py"
      - "tools/validate_json_schema.py"
      - "tools/validate_profile.py"
      - "docs/EVIDENCE_ADAPTERS.md"
      - "docs/PRE_PHASE5_READINESS.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - ".github/workflows/phase4-evidence.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "runtime/rust/src/lib_v5.rs"
      - "runtime/rust/src/phase4.rs"
      - "runtime/rust/src/phase4_v2.rs"
      - "runtime/rust/src/evidence_main.rs"
      - "research/sources.json"
      - "research/source-snapshot-policy.json"
      - "research/v0-implementation-constants.json"
      - "research/evidence/**"
      - "schemas/source-registry.schema.json"
      - "schemas/evidence-input.schema.json"
      - "schemas/evidence-bundle.schema.json"
      - "schemas/source-snapshot-policy.schema.json"
      - "schemas/model-profile.schema.json"
      - "tools/validate_sources.py"
      - "tools/validate_phase4.py"
      - "tools/validate_json_schema.py"
      - "tools/validate_profile.py"
      - "docs/EVIDENCE_ADAPTERS.md"
      - "docs/PRE_PHASE5_READINESS.md"
      - "ROADMAP.md"
      - "AGENTS.md"
      - ".github/workflows/phase4-evidence.yml"

permissions:
  contents: read

jobs:
  evidence-adapters:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
          python3 --version

      - name: Phase 4 source and readiness gates
        run: |
          python3 -m py_compile tools/validate_sources.py tools/validate_phase4.py tools/validate_json_schema.py
          python3 tools/validate_json_schema.py --self-test
          python3 tools/validate_json_schema.py --schema schemas/source-registry.schema.json research/sources.json
          python3 tools/validate_json_schema.py --schema schemas/source-snapshot-policy.schema.json research/source-snapshot-policy.json
          python3 tools/validate_json_schema.py --schema schemas/evidence-input.schema.json research/evidence/cryo-em-pentamer-count.json
          python3 tools/validate_json_schema.py profiles/igm-schematic-pentamer-v0.json
          python3 tools/validate_sources.py --self-test
          python3 tools/validate_sources.py
          python3 tools/validate_phase4.py
          python3 tools/validate_profile.py profiles/igm-schematic-pentamer-v0.json

      - name: Rust evidence adapter tests
        run: cargo test --locked --all-targets

      - name: Release build
        run: cargo build --locked --release

      - name: Structural source registry report
        run: |
          ./target/release/igm-evidence registry > /tmp/igm-source-registry-report.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/igm-source-registry-report.json', encoding='utf-8'))
          assert report['schema'] == 'IGM-PHASE4-SOURCE-REGISTRY-REPORT-V1'
          assert report['source_adapter_contract'] == 'IGM-SOURCE-ADAPTER-V1'
          assert report['structural_source_count'] >= 3
          ids = report['structural_identifier_counts']
          assert ids['doi'] >= 1 and ids['pdb'] >= 1 and ids['emdb'] >= 1
          assert report['validation_level_promoted_by_adapter'] is False
          assert report['biological_validity_claimed'] is False
          assert report['clinical_validity_claimed'] is False
          print('OK: structural source registry preserves DOI/PDB/EMDB identities')
          PY

      - name: Cryo-EM parameter adapter
        run: |
          ./target/release/igm-evidence adapt research/evidence/cryo-em-pentamer-count.json > /tmp/igm-cryo-candidate.json
          python3 - <<'PY'
          import json
          c = json.load(open('/tmp/igm-cryo-candidate.json', encoding='utf-8'))
          assert c['schema'] == 'IGM-EVIDENCE-CANDIDATE-V1'
          assert c['source_adapter_contract'] == 'IGM-SOURCE-ADAPTER-V1'
          assert c['adapter_id'] == 'IGM-CRYO-EM-PARAMETER-ADAPTER-V1'
          assert c['source_id'] == 'structure.chen-2022-full-length-igm'
          assert c['target'] == {'kind': 'parameter', 'id': 'assembly_sector_count'}
          assert c['value'] == 5 and c['unit'] == 'count'
          assert c['status'] == 'observed' and c['derivation'] == 'direct'
          assert c['uncertainty']['kind'] == 'source-reported'
          assert c['snapshot']['mode'] == 'reference-only'
          assert c['snapshot']['external_payload_committed'] is False
          assert c['claim_strengthening_detected'] is False
          assert c['validation_level_promoted_by_adapter'] is False
          assert c['biological_validity_claimed'] is False
          assert c['clinical_validity_claimed'] is False
          assert len(c['candidate_sha256']) == 64
          print('OK: cryo-EM adapter emits bounded provenance-rich candidate without claim promotion')
          PY

      - name: Duplicate evidence cannot manufacture concordance
        run: |
          if ./target/release/igm-evidence bundle \
            research/evidence/cryo-em-pentamer-count.json \
            research/evidence/cryo-em-pentamer-count.json \
            > /tmp/igm-duplicate-bundle.json; then
            echo 'expected duplicate candidate identity rejection' >&2
            exit 1
          fi
          echo 'OK: duplicate evidence candidate cannot manufacture corroboration'

      - name: Bundle schema matches emitted fields
        run: |
          ./target/release/igm-evidence bundle research/evidence/cryo-em-pentamer-count.json > /tmp/igm-evidence-bundle.json
          python3 tools/validate_json_schema.py --schema schemas/evidence-bundle.schema.json /tmp/igm-evidence-bundle.json
          python3 - <<'PY'
          import json
          b = json.load(open('/tmp/igm-evidence-bundle.json', encoding='utf-8'))
          assert b['state'] == 'single'
          assert b['resolved_value'] == 5
          assert b['reconciliation_performed'] is False
          assert b['claim_strengthening_detected'] is False
          assert b['validation_level_promoted_by_adapter'] is False
          assert b['inv_bio_001'] == 'Perfect Mathematics Does Not Equal Perfect Biological Reality'
          print('OK: emitted evidence bundle conforms to published schema')
          PY

      - name: Unsupported source claim or target is rejected
        run: |
          python3 - <<'PY'
          import json
          src = 'research/evidence/cryo-em-pentamer-count.json'
          data = json.load(open(src, encoding='utf-8'))
          data['support_statement'] = 'this stronger claim was never registered'
          with open('/tmp/igm-bad-support.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          data = json.load(open(src, encoding='utf-8'))
          data['target']['id'] = 'totally_unrelated_parameter'
          data['value'] = 999
          with open('/tmp/igm-bad-target.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
          if ./target/release/igm-evidence adapt /tmp/igm-bad-support.json; then
            echo 'expected unregistered support-statement rejection' >&2
            exit 1
          fi
          if ./target/release/igm-evidence adapt /tmp/igm-bad-target.json; then
            echo 'expected registered support statement to remain bound to target/value/derivation' >&2
            exit 1
          fi
          echo 'OK: source ingestion rejects unsupported support and target/value promotion'

      - name: Extra evidence properties fail structural schema and runtime parsing
        run: |
          python3 - <<'PY'
          import json
          src = 'research/evidence/cryo-em-pentamer-count.json'
          data = json.load(open(src, encoding='utf-8'))
          data['uncertanty_typo'] = {'kind': 'unknown'}
          with open('/tmp/igm-extra-property.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
          if python3 tools/validate_json_schema.py --schema schemas/evidence-input.schema.json /tmp/igm-extra-property.json; then
            echo 'expected schema additionalProperties=false rejection' >&2
            exit 1
          fi
          if ./target/release/igm-evidence adapt /tmp/igm-extra-property.json; then
            echo 'expected strict Serde unknown-field rejection' >&2
            exit 1
          fi
          echo 'OK: Phase 4 schema and runtime both reject unknown evidence fields'
